name: Release

# 當 main 上的 package.json 版本號變更（且該版本尚未有 tag）時，
# 自動建置 macOS 與 Windows 版本，並建立 v<version> tag 與 GitHub Release。
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 只讀 package.json 與遠端 tag，不安裝相依套件，幾秒內決定是否要發版
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Check whether this version is already released
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version already exists; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # 型別檢查與單元測試與建置平行執行；release job 仍要求兩者皆通過才發佈
  verify:
    name: verify
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm test:unit

  build:
    name: build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    timeout-minutes: 45
    strategy:
      # 一個平台失敗不要取消其他平台：重跑時只需重跑失敗的那個。發布仍要等全部成功。
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 與 Intel 拆成兩個平行 job，不再於同一台機器上依序打包
          - name: macos-arm64
            os: macos-latest
            builder-args: --mac --arm64
            artifact-glob: release/*.dmg
          - name: macos-x64
            os: macos-latest
            builder-args: --mac --x64
            artifact-glob: release/*.dmg
          - name: windows
            os: windows-latest
            builder-args: --win --x64
            artifact-glob: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # 目前沒有簽章憑證：關閉 macOS 自動尋找簽章身分，產出未簽章版本
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 統一快取位置，讓 Electron 與 electron-builder 下載的二進位檔可跨次重用
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.name }}-

      - run: pnpm install --frozen-lockfile

      # 不走 pnpm build：其 prebuild 會清理本機 Agent Pets 程序，CI 不需要
      - run: pnpm exec vite build

      - name: Check plugin panel tokens bundle
        run: pnpm check:bundle

      # electron-builder 打包時會從 GitHub releases 下載 Electron 與工具。GitHub 有時對特定
      # 檔案（例如 SHASUMS256.txt）持續回 504，但同一個檔案經 API 下載正常。第一次失敗後
      # 改用 scripts/release-asset-mirror.mjs（只聽 127.0.0.1，經 GitHub API 下載）再試兩次，
      # 間隔 30、60 秒。checksum 仍由打包工具照原本方式驗證。
      - name: Package
        shell: bash
        env:
          BUILDER_ARGS: ${{ matrix.builder-args }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          build() {
            # BUILDER_ARGS 是 matrix 內的固定參數，需要拆成多個引數，所以不加引號。
            # shellcheck disable=SC2086
            pnpm exec electron-builder $BUILDER_ARGS --publish never
          }
          build && exit 0

          node scripts/release-asset-mirror.mjs > "$RUNNER_TEMP/asset-mirror.log" 2>&1 &
          for _ in $(seq 1 50); do
            port=$(sed -n 's/^port=//p' "$RUNNER_TEMP/asset-mirror.log")
            [ -n "$port" ] && break
            sleep 0.2
          done
          if [ -z "$port" ]; then
            cat "$RUNNER_TEMP/asset-mirror.log"
            exit 1
          fi
          export ELECTRON_MIRROR="http://127.0.0.1:$port/electron/"
          export ELECTRON_BUILDER_BINARIES_MIRROR="http://127.0.0.1:$port/builder/"
          export ELECTRON_BUILDER_BINARIES_ALLOW_HTTP=true

          for attempt in 2 3; do
            delay=$((30 * (attempt - 1)))
            echo "::warning::electron-builder failed; retrying through the API download mirror in ${delay}s (attempt $attempt of 3)"
            sleep "$delay"
            build && exit 0
          done
          cat "$RUNNER_TEMP/asset-mirror.log"
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    name: release
    needs: [version, verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-release
          merge-multiple: true

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist-release
          gh release create "v$VERSION" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Agent Pets $VERSION" \
            --generate-notes
