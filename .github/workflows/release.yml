name: Release

# 當 main 上的 package.json 版本號變更（且該版本尚未有 tag）時，
# 自動建置 macOS 與 Windows 版本，並建立 v<version> tag 與 GitHub Release。
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 只讀 package.json 與遠端 tag，不安裝相依套件，幾秒內決定是否要發版
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Check whether this version is already released
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version already exists; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # 型別檢查與單元測試與建置平行執行；release job 仍要求兩者皆通過才發佈
  verify:
    name: verify
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm test:unit

  build:
    name: build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # Apple Silicon 與 Intel 拆成兩個平行 job，不再於同一台機器上依序打包
          - name: macos-arm64
            os: macos-latest
            builder-args: --mac --arm64
            artifact-glob: release/*.dmg
          - name: macos-x64
            os: macos-latest
            builder-args: --mac --x64
            artifact-glob: release/*.dmg
          - name: windows
            os: windows-latest
            builder-args: --win --x64
            artifact-glob: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # 目前沒有簽章憑證：關閉 macOS 自動尋找簽章身分，產出未簽章版本
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 統一快取位置，讓 Electron 與 electron-builder 下載的二進位檔可跨次重用
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.name }}-

      - run: pnpm install --frozen-lockfile

      # 不走 pnpm build：其 prebuild 會清理本機 Agent Pets 程序，CI 不需要
      - run: pnpm exec vite build

      - name: Check plugin panel tokens bundle
        run: pnpm check:bundle

      - run: pnpm exec electron-builder ${{ matrix.builder-args }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    name: release
    needs: [version, verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-release
          merge-multiple: true

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist-release
          gh release create "v$VERSION" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Agent Pets $VERSION" \
            --generate-notes
